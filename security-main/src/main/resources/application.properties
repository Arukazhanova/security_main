spring.application.name=securitysite
server.port=${SERVER_PORT:8081}

spring.config.import=optional:file:.env[.properties]

# ????????? ?????????? ???? ?? ?????????.
# PostgreSQL ?????? ?? ??????????.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/securitysite_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-this-dev-secret-to-a-long-random-string-32-plus-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}

# ????????? ????? ?????? Gmail / SMTP / ????????? ????????.
# ?????? ??????????? ? ?? ? ???????? ????? /api/local-mail.
app.base-url=${APP_BASE_URL:http://localhost:5174}
app.local-mailbox.enabled=${LOCAL_MAILBOX_ENABLED:true}
app.auth.expose-links-in-response=${EXPOSE_AUTH_LINKS_IN_RESPONSE:true}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.local}
app.admin.password=${ADMIN_PASSWORD:Admin12345}
app.admin.create-on-startup=${ADMIN_CREATE_ON_STARTUP:true}

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs